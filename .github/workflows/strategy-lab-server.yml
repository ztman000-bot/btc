name: Strategy Lab 4H Server

on:
  workflow_dispatch:
  schedule:
    - cron: '12 0,4,8,12,16,20 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/strategy_lab_server.py'
      - '.github/workflows/strategy-lab-server.yml'

permissions:
  contents: write

concurrency:
  group: strategy-lab-4h
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build strategy lab data
        run: python scripts/strategy_lab_server.py
      - name: Commit lab state
        run: |
          git config user.name "btc-strategy-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/lab-latest.json data/research/lab-history.json
          if git diff --cached --quiet; then
            echo "No lab changes"
          else
            git commit -m "research: update 4H strategy lab"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
