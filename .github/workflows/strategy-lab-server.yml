name: Strategy Lab 4H Server

on:
  workflow_dispatch:
  schedule:
    # Explicit off-hour minute reduces scheduler congestion.
    - cron: '23 1,5,9,13,17,21 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/strategy_lab_server.py'
      - '.github/workflows/strategy-lab-server.yml'
  pull_request:
    paths:
      - 'scripts/strategy_lab_server.py'
      - '.github/workflows/strategy-lab-server.yml'

permissions:
  contents: write

concurrency:
  group: btc-strategy-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build strategy lab data
        run: python scripts/strategy_lab_server.py
      - name: Validate risk-return metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/research/lab-latest.json').read_text(encoding='utf-8'))
          required=('expectancyPct','profitFactor','avgWinPct','avgLossPct','payoffRatio','grossProfitPct','grossLossPct')
          assert d.get('strategies'), 'strategy results missing'
          for s in d['strategies']:
              missing=[k for k in required if k not in s]
              assert not missing, f"{s.get('id','?')} missing metrics: {missing}"
              assert s.get('n',0) >= 0
          live=d.get('live',{})
          missing=[k for k in required if k not in live]
          assert not missing, f'live missing metrics: {missing}'
          print('strategy lab metrics validated:', len(d['strategies']), 'strategies')
          PY
      - name: Commit lab state conflict-safe
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config user.name "btc-strategy-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/btc-lab-state
          cp data/research/lab-latest.json /tmp/btc-lab-state/lab-latest.json
          cp data/research/lab-history.json /tmp/btc-lab-state/lab-history.json
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/btc-lab-state/lab-latest.json data/research/lab-latest.json
            cp /tmp/btc-lab-state/lab-history.json data/research/lab-history.json
            git add data/research/lab-latest.json data/research/lab-history.json
            if git diff --cached --quiet; then echo "No lab changes"; exit 0; fi
            git commit -m "research: update 4H strategy lab"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt * 3))
          done
          exit 1
