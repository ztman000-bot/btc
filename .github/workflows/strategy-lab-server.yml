name: Strategy Lab 4H Server

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/strategy_lab_server.py'
      - '.github/workflows/strategy-lab-server.yml'

permissions:
  contents: write

concurrency:
  group: btc-strategy-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build strategy lab data
        run: python scripts/strategy_lab_server.py
      - name: Commit lab state safely
        run: |
          set -e
          git config user.name "btc-strategy-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/lab-latest.json data/research/lab-history.json
          if git diff --cached --quiet; then
            echo "No lab changes"
            exit 0
          fi
          git commit -m "research: update 4H strategy lab"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Lab push conflict; retry ${attempt}/3"
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || true
            sleep $((attempt * 3))
          done
          echo "Failed to push lab state after 3 attempts"
          exit 1
