name: Strategy Lab 4H Server

on:
  workflow_dispatch:
  schedule:
    # Explicit off-hour minute reduces scheduler congestion.
    - cron: '23 1,5,9,13,17,21 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/strategy_lab_server.py'
      - '.github/workflows/strategy-lab-server.yml'

permissions:
  contents: write

concurrency:
  group: btc-strategy-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build strategy lab data
        run: python scripts/strategy_lab_server.py
      - name: Commit lab state conflict-safe
        run: |
          set -e
          git config user.name "btc-strategy-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/btc-lab-state
          cp data/research/lab-latest.json /tmp/btc-lab-state/lab-latest.json
          cp data/research/lab-history.json /tmp/btc-lab-state/lab-history.json
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/btc-lab-state/lab-latest.json data/research/lab-latest.json
            cp /tmp/btc-lab-state/lab-history.json data/research/lab-history.json
            git add data/research/lab-latest.json data/research/lab-history.json
            if git diff --cached --quiet; then echo "No lab changes"; exit 0; fi
            git commit -m "research: update 4H strategy lab"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt * 3))
          done
          exit 1
