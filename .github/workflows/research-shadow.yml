name: BTC 24H Research Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/research_shadow.py'
      - 'data/research/config.json'
      - '.github/workflows/research-shadow.yml'

permissions:
  contents: write

concurrency:
  group: btc-research-shadow
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run shadow research
        run: python scripts/research_shadow.py

      - name: Commit research state
        run: |
          git config user.name "btc-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/latest.json data/research/shadow-history.json
          if git diff --cached --quiet; then
            echo "No research changes"
          else
            git commit -m "research: update 24H shadow state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
