name: BTC 24H Research Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/research_shadow.py'
      - 'scripts/research_v2_enhance.py'
      - 'data/research/config.json'
      - '.github/workflows/research-shadow.yml'
      - '.github/workflows/research-watchdog.yml'

permissions:
  contents: write

concurrency:
  group: btc-research-shadow
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run shadow research
        run: |
          python scripts/research_shadow.py
          python scripts/research_v2_enhance.py
      - name: Write scheduler heartbeat
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          d={
            'at': datetime.now(timezone.utc).isoformat(),
            'event': os.getenv('GITHUB_EVENT_NAME','unknown'),
            'workflow': os.getenv('GITHUB_WORKFLOW','BTC 24H Research Shadow'),
            'runId': os.getenv('GITHUB_RUN_ID'),
            'runNumber': os.getenv('GITHUB_RUN_NUMBER'),
            'sha': os.getenv('GITHUB_SHA')
          }
          with open('data/research/research-heartbeat.json','w',encoding='utf-8') as f:
            json.dump(d,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit research state conflict-safe
        run: |
          set -e
          git config user.name "btc-research-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/btc-research-state
          cp data/research/latest.json /tmp/btc-research-state/latest.json
          cp data/research/shadow-history.json /tmp/btc-research-state/shadow-history.json
          cp data/research/regime-state.json /tmp/btc-research-state/regime-state.json
          cp data/research/research-heartbeat.json /tmp/btc-research-state/research-heartbeat.json
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/btc-research-state/latest.json data/research/latest.json
            cp /tmp/btc-research-state/shadow-history.json data/research/shadow-history.json
            cp /tmp/btc-research-state/regime-state.json data/research/regime-state.json
            cp /tmp/btc-research-state/research-heartbeat.json data/research/research-heartbeat.json
            git add data/research/latest.json data/research/shadow-history.json data/research/regime-state.json data/research/research-heartbeat.json
            if git diff --cached --quiet; then echo "No research changes"; exit 0; fi
            git commit -m "research: update 24H confirmed-bar shadow state"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt * 3))
          done
          exit 1
