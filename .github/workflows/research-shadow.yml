name: BTC 24H Research Shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/research_shadow.py'
      - 'scripts/research_v2_enhance.py'
      - 'data/research/config.json'
      - '.github/workflows/research-shadow.yml'

permissions:
  contents: write

concurrency:
  group: btc-research-shadow
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run shadow research
        run: |
          python scripts/research_shadow.py
          python scripts/research_v2_enhance.py
      - name: Commit research state safely
        run: |
          set -e
          git config user.name "btc-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/latest.json data/research/shadow-history.json
          if git diff --cached --quiet; then echo "No research changes"; exit 0; fi
          git commit -m "research: update 24H shadow state"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || true
            sleep $((attempt * 3))
          done
          exit 1
