name: BTC Stability Smoke

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - 'scripts/**.py'
      - '.github/workflows/stability-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-stability-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          set -e
          for f in ./*.js; do
            echo "checking $f"
            node --check "$f"
          done
      - name: Python syntax
        run: python -m compileall -q scripts
      - name: Stability architecture assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          cfg=Path('app-config.js').read_text(encoding='utf-8')
          upd=Path('updater.js').read_text(encoding='utf-8')
          boot=Path('version-guard.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          stab=Path('stability-guard.js').read_text(encoding='utf-8')
          cleanup=Path('stability-cleanup.js').read_text(encoding='utf-8')
          safety=Path('safety-core.js').read_text(encoding='utf-8')
          shell=Path('v850-shell.js').read_text(encoding='utf-8')
          patch=Path('v8223-ui.js').read_text(encoding='utf-8')
          research=Path('research-shadow.js').read_text(encoding='utf-8')
          recovery=Path('recovery-v2-ui.js').read_text(encoding='utf-8')
          health=Path('research-health.js').read_text(encoding='utf-8')
          m=re.search(r"version:'(8\.22\.\d+)'",cfg)
          assert m, 'canonical 8.22.x version missing from app-config'
          version=m.group(1)
          assert 'version-guard.js' in upd and 'safety-core.js' not in upd, 'updater must remain thin'
          for name in ['safety-core.js','research-health.js','stability-guard.js','startup-health.js','v8223-ui.js','scanner-network-fix.js','stability-cleanup.js']:
              assert name in boot, f'missing canonical bootstrap module: {name}'
          assert '__BTC_STABILITY_GUARD_SINGLETON' in stab, 'stability singleton missing'
          assert 'BTC_DECISION_ALLOWED===true' in safety.replace(' ',''), 'central safety must be fail-closed'
          assert 'BTC_DECISION_ALLOWED===true' in stab.replace(' ',''), 'legacy bridge must be fail-closed'
          assert "['home','⌂','홈']" in shell and "['research','⌬','연구소']" in shell, 'canonical bottom routes missing'
          assert 'v8222ResearchShadowSlot' in research, 'Research Shadow must be isolated to research route'
          assert 'v8222RecoverySlot' in recovery, 'Recovery V2 must be isolated to research route'
          assert 'v8222ResearchHealthSlot' in health, 'Research Health must be isolated to research route'
          for card in ['adaptiveLearningCard','reversalIntelligenceCard','strategyGovernanceCard','terminalWalletCard','hedgeRotationCard','recoveryEngineCard','executionExitCard']:
              assert card in patch, f'missing restored strategy engine: {card}'
          assert 'v8223PriceStrip' in patch and 'setInterval(updatePrice,2000)' in patch, 'persistent price strip missing'
          assert f"const APP_VERSION='{version}'" in sw, 'service worker cache version must match canonical config'
          for asset in ['v8223-ui.js','scanner-network-fix.js','scanner-hotfix-v8225.js','stability-cleanup.js']:
              assert asset in sw, f'service worker missing managed asset: {asset}'
          assert "BTC_APP_CONFIG?.version" in stab and "register('./sw.js?v='" in stab, 'service worker registration must use canonical app version'
          assert 'BTC_APP_CONFIG?.version' in cleanup and "register('./sw.js?v='" in cleanup, 'cleanup guard must follow canonical app version'
          legacy=Path('index.html').read_text(encoding='utf-8')
          if re.search(r'\bchanged\s*=\s*False\b|\bchanged\s*=\s*True\b', legacy):
              print('WARNING: legacy scanner source still contains Python-style booleans; runtime guard patches this path.')
          if 'sw.js?v=8188' in legacy:
              print('INFO: legacy SW registration remains in index, but canonical SW ignores legacy query and cleanup re-registers current version.')
          print('stability architecture assertions passed for',version)
          PY
