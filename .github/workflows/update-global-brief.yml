name: Update Global Brief

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install feedparser deep-translator
      - name: Build briefing
        run: python scripts/global_brief.py
      - name: Commit updated briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/brief.json data/daily/global.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update global briefing"
            git push
          fi
