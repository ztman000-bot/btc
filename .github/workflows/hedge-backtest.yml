name: BTC Hedge Backtest

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/hedge_backtest.py'
      - '.github/workflows/hedge-backtest.yml'

permissions:
  contents: write

concurrency:
  group: btc-hedge-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reproducible hedge backtest
        run: python scripts/hedge_backtest.py
      - name: Commit backtest result safely
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backtests/hedge_strategy.json
          if git diff --cached --quiet; then
            echo 'No result changes'
            exit 0
          fi
          git commit -m 'Update hedge strategy backtest result'
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Backtest push conflict; retry ${attempt}/3"
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || true
            sleep $((attempt * 3))
          done
          echo 'Failed to push backtest result after 3 attempts'
          exit 1
