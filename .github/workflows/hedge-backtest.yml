name: BTC Hedge Backtest

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/hedge_backtest.py'
      - '.github/workflows/hedge-backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reproducible hedge backtest
        run: python scripts/hedge_backtest.py
      - name: Commit backtest result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backtests/hedge_strategy.json
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Update hedge strategy backtest result'
            git push
          fi
