name: Update Stock Relay Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: btc-stock-relay
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch stock data
        run: python .github/scripts/fetch_market_data.py
      - name: Commit updated JSON safely
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks
          if git diff --cached --quiet; then
            echo "No stock changes"
            exit 0
          fi
          git commit -m "Update stock relay data"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Stock push conflict; retry ${attempt}/3"
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || true
            sleep $((attempt * 3))
          done
          echo "Failed to push stock data after 3 attempts"
          exit 1
