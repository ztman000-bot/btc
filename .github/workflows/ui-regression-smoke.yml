name: BTC UI Regression Smoke

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - '.github/workflows/ui-regression-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-ui-regression-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Start local app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/btc-http.log 2>&1 &
          echo $! > /tmp/btc-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - name: Browser regression checks
        env:
          BTC_TEST_URL: http://127.0.0.1:4173/#home
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const candidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath=candidates.find(p=>fs.existsSync(p));
          if(!executablePath) throw new Error('No Chromium/Chrome executable on runner');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:430,height:932}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.BTC_TEST_URL,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);
            async function visible(sel,label){
              const loc=page.locator(sel).first();
              if(await loc.count()===0) throw new Error(label+' missing: '+sel);
              if(!(await loc.isVisible())) throw new Error(label+' hidden: '+sel);
            }
            await visible('#v850HomePane','home pane');
            await visible('.nextActionCard','next action');
            await visible('#v850ResearchSlot','research slot');
            await page.waitForTimeout(12500);
            await visible('#v850HomePane','home pane after 15s');
            await visible('.nextActionCard','next action after 15s');
            await visible('#researchShadowCard','24H Research & Shadow after 15s');
            const parent=await page.locator('#researchShadowCard').evaluate(el=>el.parentElement?.id||'');
            if(parent!=='v850ResearchSlot') throw new Error('Research Shadow escaped canonical slot: '+parent);
            await page.locator('footer.v850Nav button[data-route="more"]').click();
            await page.waitForTimeout(300);
            await visible('#v850MorePane','more pane');
            const labBtn=page.locator('#v850MorePane [data-open="strategyLab"]');
            if(await labBtn.count()===0) throw new Error('Strategy Lab menu missing');
            await labBtn.click();
            await page.waitForTimeout(500);
            await visible('#strategyLab','strategy lab route');
            await page.locator('footer.v850Nav button[data-route="home"]').click();
            await page.waitForTimeout(500);
            await visible('#v850HomePane','home after lab');
            await visible('#researchShadowCard','research after home return');
            const fatal=errors.filter(x=>!/fetch|network|Failed to fetch|CORS/i.test(x));
            if(fatal.length) console.log('Non-network page errors observed:',fatal.slice(0,10));
            await browser.close();
            console.log('UI regression smoke passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
